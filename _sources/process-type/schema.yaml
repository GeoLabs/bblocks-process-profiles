$schema: https://json-schema.org/draft/2020-12/schema
title: Registered Process Activity Type
description: 'A candidate process-type register item which is also a class used as the PROV rdf:type of
  executions. It profiles the Registered Item Model activity-type schema; each entry is both an acttype:ActivityType
  register item and an owl:Class specialising acttype:ActivityType, or, when it implements an Implementation
  Profile, the activity type of its operation in bblocks-generic-profiles, with the same GeoSPARQL entity
  types.


  Decision D5: one entry per deployed process, in five parts. Its meaning is `prefLabel`, `definition`
  and `subClassOf`. Its classification (`classification`: the six-phase position), its deployment (`deployment`:
  profile block, processDescription, run class), its plan (`plan`) and its correspondences (`correspondences`:
  openEO) are kept apart from that meaning. `implementsProfile` links it to its Implementation Profile
  (tier 3), with the declarations that qualify the binding (`serverSideFiles`, `roleDecompositions`, `assumedFormatGaps`).


  What an activity of this type executes -- its plan, a `prov:Plan` -- is the OGC Application Package
  served by OGC API - Processes - Part 2 (Deploy, Replace, Undeploy) at `/processes/{processID}/package`,
  whose execution unit is the pinned CWL. A run of this type records the same IRI as its `qualifiedAssociation.hadPlan`.
  A process implemented natively by its server (`mutable: false`) has no Application Package (Part 2 serves
  `/package` only for dynamically deployed processes) and so no `plan`; `deployment.processDescription`
  is then the only link to what is executed.'
allOf:
- $ref: bblocks://ogc.register.schemas.activity-types-schema
- type: object
  required:
  - id
  - type
  - prefLabel
  - definition
  - inScheme
  - classification
  - deployment
  - correspondences
  - objectIdentifier
  - itemClass
  - inRegister
  - validityStatus
  - publicationStatus
  - subClassOf
  - hasAction
  properties:
    id:
      description: IRI of the process type (also used as `activityType` in provenance records).
      type: string
      format: uri
    type:
      const:
      - ProcessType
      - owlClass
      - ActivityType
    prefLabel:
      type: string
    definition:
      type: string
    inScheme:
      description: IRI of the process-type register (concept scheme) this entry is proposed to.
      type: string
      format: uri
    classification:
      description: 'Classification of the type, apart from its meaning (decision D5). `phase` (pp:phase,
        formerly skos:broader) is a separate axis from the Process Concepts of bblocks-generic-profiles:
        see the block description.'
      type: object
      required:
      - phase
      additionalProperties: false
      properties:
        phase:
          description: Position(s) in the six-phase workflow framework.
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - https://geolabs.github.io/bblocks-process-profiles/def/phase/filter-configuration
            - https://geolabs.github.io/bblocks-process-profiles/def/phase/selection-filtering
            - https://geolabs.github.io/bblocks-process-profiles/def/phase/data-retrieval
            - https://geolabs.github.io/bblocks-process-profiles/def/phase/pre-processing
            - https://geolabs.github.io/bblocks-process-profiles/def/phase/scientific-computation
            - https://geolabs.github.io/bblocks-process-profiles/def/phase/export-aggregation
    deployment:
      description: 'What is deployed (decision D5): the process profile block, the processDescription
        and the class of its run records.'
      type: object
      required:
      - profile
      - processDescription
      - provenanceClass
      additionalProperties: false
      properties:
        profile:
          description: Identifier of the process-profile Building Block.
          type: string
        processDescription:
          description: The OGC API - Processes processDescription this type is profiled from, at `href`
            (the `/processes/{processID}` resource). For a CWL-sourced process it is the description the
            Application Package would deploy, under the illustrative host `ospd.example.org`; for a live
            process (e.g. a ZOO-Project deployment, `ospd.process-profiles.sqlmm.*`) the real one.
          type: object
          required:
          - id
          - version
          - href
          properties:
            id:
              type: string
            version:
              type: string
            href:
              type: string
              format: uri
            license:
              description: Of a live process; omitted, not null, when it declares none -- do not assume
                one.
              type: string
              format: uri
        provenanceClass:
          description: Class of the run records produced by executing this process.
          type: string
          enum:
          - http://purl.org/wf4ever/wfprov#ProcessRun
          - http://purl.org/wf4ever/wfprov#WorkflowRun
    plan:
      description: 'The plan (`prov:Plan`) an activity of this type executes: the OGC Application Package
        at `/processes/{processID}/package` (OGC API - Processes - Part 2, requirement /req/deploy-replace-undeploy/package-get-op),
        whose `executionUnit` is the pinned CWL. Present only for a CWL-sourced process.'
      type: object
      required:
      - id
      - type
      - executionUnit
      - cwlClass
      - cwlId
      properties:
        id:
          type: string
          format: uri
          pattern: /processes/[^/]+/package$
        type:
          const: Plan
        executionUnit:
          description: Same link as the Application Package's own `executionUnit` (examples/ogcapppkg.json).
          type: object
          required:
          - href
          - type
          properties:
            href:
              description: Pinned URL of the CWL document.
              type: string
              format: uri
            type:
              type: string
            rel:
              type: string
        cwlClass:
          enum:
          - CommandLineTool
          - Workflow
          - ExpressionTool
        cwlId:
          type: string
        license:
          type: string
          format: uri
        cctDependencies:
          description: EOAP CWL custom types used by the CWL.
          type: array
          items:
            type: string
            pattern: ^eoap\.cct\.
        candidateCctDependencies:
          description: EOAP CWL custom types that could replace plain CWL types (not used by the CWL).
          type: array
          items:
            type: string
            pattern: ^eoap\.cct\.
    serverSideFiles:
      description: Inputs and outputs that this deployment passes as names of files stored on the server
        (relative to the ZOO-Kernel `dataPath`), not as encoded data, so with no media type. Each names
        the Implementation Profile role whose format the file has (`implements`).
      type: array
      minItems: 1
      items:
        type: object
        required:
        - name
        - side
        - implements
        - location
        properties:
          name:
            type: string
          side:
            enum:
            - inputs
            - outputs
          implements:
            type: string
            format: uri
          location:
            type: string
    roleDecompositions:
      description: Implementation Profile roles that this deployment takes as several inputs (or outputs),
        none of which is the role and none of which carries its representation -- e.g. the bounding box
        of raster-crop taken by OTB.ExtractROI as four corner numbers and a unit. Declared so that the
        gap is explicit (decision of 2026-11-09).
      type: array
      minItems: 1
      items:
        type: object
        required:
        - side
        - implements
        - parts
        - note
        additionalProperties: false
        properties:
          side:
            enum:
            - inputs
            - outputs
          implements:
            type: string
            format: uri
          parts:
            type: array
            minItems: 2
            items:
              type: string
          note:
            type: string
          selectors:
            description: 'The conditions under which the parts implement the role: each a deployed input
              and the values it must take.'
            type: array
            minItems: 1
            items:
              type: object
              required:
              - name
              - values
              additionalProperties: false
              properties:
                name:
                  type: string
                values:
                  type: array
                  minItems: 1
                  items:
                    type: string
    assumedFormatGaps:
      description: Bound inputs and outputs whose Implementation Profile representation this deployment
        does not serve (no media type exposed), accepted with a reason and its evidence (A4.3, docs/FORMAT-CHECK.md).
      type: array
      minItems: 1
      items:
        type: object
        required:
        - name
        - side
        - implements
        - served
        - reason
        - evidence
        additionalProperties: false
        properties:
          name:
            type: string
          side:
            enum:
            - inputs
            - outputs
          implements:
            type: string
            format: uri
          served:
            type: array
            items:
              type: string
          reason:
            type: string
          evidence:
            type: string
    implementsProfile:
      description: 'IRI of the nearest applicable profile this process specialises, in the generic-profiles
        register -- normally an Implementation Profile (generic-profiles.implementation-profile.*, OGC
        14-065 WPS 2.0.2 §7.5.3: standard data formats, still not one specific deployment''s own choice),
        or a Generic Profile directly when no Implementation Profile exists yet. Optional: most processes
        have no standardised abstract counterpart at all. `processDescription` and `plan` (this entry''s
        own concrete binding) are what further specialise it to one real, deployed process -- Implementation
        (instance level) in the same standard''s terms.'
      type: string
      format: uri
    hasStep:
      description: Process types of the steps of a Workflow.
      type: array
      items:
        type: string
        format: uri
    correspondences:
      description: 'Proposed correspondences with openEO (decision D5: apart from the meaning of the type).
        The SKOS mapping properties stay on the type; `openeoEquivalence` states the level, including
        `none`.'
      type: object
      required:
      - openeoEquivalence
      additionalProperties: false
      properties:
        exactMatch:
          type: array
          items:
            type: string
            format: uri
        closeMatch:
          type: array
          items:
            type: string
            format: uri
        relatedMatch:
          type: array
          items:
            type: string
            format: uri
        openeoEquivalence:
          type: object
          required:
          - level
          - rationale
          properties:
            level:
              enum:
              - exactMatch
              - closeMatch
              - none
            rationale:
              type: string
            decomposition:
              description: Ordered correspondence of the stages of a composite or opaque process.
              type: array
              items:
                type: object
                required:
                - stage
                - level
                properties:
                  stage:
                    type: string
                  openeo:
                    type: array
                    items:
                      type: string
                      pattern: ^ogc\.openeo\.
                  level:
                    enum:
                    - exactMatch
                    - closeMatch
                    - none
                  note:
                    type: string
    itemClass:
      const: https://w3id.org/ogc/rim/activity-type/activityTypeItemClass
    inRegister:
      const: https://geolabs.github.io/bblocks-process-profiles/def/register
    objectIdentifier:
      type: string
      format: uri
      description: The process-type entry IRI; permanently identifies this register item.
    validityStatus:
      enum:
      - valid
      - invalid
    publicationStatus:
      enum:
      - published
      - unpublished
    subClassOf:
      description: 'The parent class: acttype:ActivityType, or, for a process attached to an Implementation
        Profile, the activity type of its operation in bblocks-generic-profiles (decision D5, 2026-11-10).
        The enum is written by scripts/generate.py from the activity types of that register, so that no
        other value passes.'
      enum:
      - https://w3id.org/ogc/rim/activity-type/ActivityType
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/analytical-hillshading
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/area
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/buffer
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/centroid
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/contains
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/convex-hull
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/crosses
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/difference
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/disjoint
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/equals
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/geometry-extent
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/intersection
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/intersects
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/is-simple
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/point-cloud-thinning
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/point-cloud-to-grid
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/point-cloud-to-shapes
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/radiometric-index
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/raster-band-math
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/raster-band-math-multiband
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/raster-crop
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/raster-extent
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/raster-format-conversion
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/raster-reprojection
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/slope
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/symdifference
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/terrain-ruggedness-index
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/topographic-position-index
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/touches
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/union
      - https://geolabs.github.io/bblocks-generic-profiles/def/activity-type/within
    hasAction:
      description: 'The register actions of the entry: its addition, then each in-place amendment of the
        proposal (pp:amendmentAction, always classified substantive or clarifying, pp:specification).'
      type: array
      minItems: 1
      items:
        oneOf:
        - type: object
          required:
          - id
          - type
          - actionType
          - proposer
          - startedAtTime
          - appliesTo
          properties:
            id:
              type: string
              format: uri
            type:
              const: RegisterAction
            actionType:
              const: addition
            proposer:
              const: https://geolabs.github.io/bblocks-process-profiles/def/geolabs
            startedAtTime:
              type: string
              format: date-time
            appliesTo:
              type: string
              format: uri
        - type: object
          required:
          - id
          - type
          - actionType
          - changeClassification
          - description
          - proposer
          - startedAtTime
          - appliesTo
          properties:
            id:
              type: string
              format: uri
            type:
              const: RegisterAction
            actionType:
              const: https://geolabs.github.io/bblocks-process-profiles/def/amendmentAction
            changeClassification:
              enum:
              - substantive
              - clarifying
            description:
              type: string
            proposer:
              const: https://geolabs.github.io/bblocks-process-profiles/def/geolabs
            startedAtTime:
              type: string
              format: date-time
            appliesTo:
              type: string
              format: uri
      contains:
        type: object
        required:
        - id
        - type
        - actionType
        - proposer
        - startedAtTime
        - appliesTo
        properties:
          id:
            type: string
            format: uri
          type:
            const: RegisterAction
          actionType:
            const: addition
          proposer:
            const: https://geolabs.github.io/bblocks-process-profiles/def/geolabs
          startedAtTime:
            type: string
            format: date-time
          appliesTo:
            type: string
            format: uri
    usedEntityType:
      description: 'acttype:usedEntityType: the GeoSPARQL class(es) of the parent activity type, repeated
        (decision of 2026-11-10).'
      anyOf:
      - enum:
        - http://www.opengis.net/ont/geosparql#SpatialObject
        - http://www.opengis.net/ont/geosparql#Feature
        - http://www.opengis.net/ont/geosparql#Geometry
        - http://www.opengis.net/ont/geosparql#SpatialObjectCollection
        - http://www.opengis.net/ont/geosparql#FeatureCollection
        - http://www.opengis.net/ont/geosparql#GeometryCollection
      - type: array
        minItems: 1
        items:
          enum:
          - http://www.opengis.net/ont/geosparql#SpatialObject
          - http://www.opengis.net/ont/geosparql#Feature
          - http://www.opengis.net/ont/geosparql#Geometry
          - http://www.opengis.net/ont/geosparql#SpatialObjectCollection
          - http://www.opengis.net/ont/geosparql#FeatureCollection
          - http://www.opengis.net/ont/geosparql#GeometryCollection
    generatedEntityType:
      description: 'acttype:generatedEntityType: the GeoSPARQL class(es) of the parent activity type,
        repeated (decision of 2026-11-10).'
      anyOf:
      - enum:
        - http://www.opengis.net/ont/geosparql#SpatialObject
        - http://www.opengis.net/ont/geosparql#Feature
        - http://www.opengis.net/ont/geosparql#Geometry
        - http://www.opengis.net/ont/geosparql#SpatialObjectCollection
        - http://www.opengis.net/ont/geosparql#FeatureCollection
        - http://www.opengis.net/ont/geosparql#GeometryCollection
      - type: array
        minItems: 1
        items:
          enum:
          - http://www.opengis.net/ont/geosparql#SpatialObject
          - http://www.opengis.net/ont/geosparql#Feature
          - http://www.opengis.net/ont/geosparql#Geometry
          - http://www.opengis.net/ont/geosparql#SpatialObjectCollection
          - http://www.opengis.net/ont/geosparql#FeatureCollection
          - http://www.opengis.net/ont/geosparql#GeometryCollection
  additionalProperties: true
  allOf:
  - if:
      required:
      - subClassOf
      properties:
        subClassOf:
          not:
            const: https://w3id.org/ogc/rim/activity-type/ActivityType
    then:
      anyOf:
      - required:
        - usedEntityType
      - required:
        - generatedEntityType
