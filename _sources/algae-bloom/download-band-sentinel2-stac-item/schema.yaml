$schema: https://json-schema.org/draft/2020-12/schema
description: Profile of the OGC API - Processes processDescription of `download-band-sentinel2-stac-item`
  (CWL CommandLineTool). Pins the process id and the input/output names; the input/output schemas are
  those derived from the CWL.
allOf:
- $ref: bblocks://ogc.api.processes.v1.schemas.process
- $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
- type: object
  required:
  - id
  - version
  - inputs
  - outputs
  properties:
    id:
      const: download-band-sentinel2-stac-item
    inputs:
      type: object
      required:
      - product_url
      - band
      propertyNames:
        enum:
        - product_url
        - band
    outputs:
      type: object
      required:
      - product
      propertyNames:
        enum:
        - product
$defs:
  rawProcessDescription:
    $ref: bblocks://ogc.api.processes.v1.schemas.process
  applicationPackage:
    $ref: bblocks://ogc.api.processes.v2.schemas.ogcapppkg
  provenance:
    $ref: bblocks://ogc.bbr.provenance.provenance
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  w3cProvJsonLd:
    $ref: bblocks://ogc.ogc-utils.prov.w3c-prov-jsonld
  execute:
    description: Execute request for this process. Built on the processDescription input schemas and on
      ogc.api.processes.v1.schemas.link / qualifiedInputValue, because ogc.api.processes.v1.schemas.execute
      rejects plain strings and numbers (upstream issue U-01).
    type: object
    required:
    - inputs
    properties:
      inputs:
        type: object
        required:
        - product_url
        - band
        propertyNames:
          enum:
          - product_url
          - band
        additionalProperties:
          anyOf:
          - $ref: bblocks://ogc.api.processes.v1.schemas.link
          - $ref: bblocks://ogc.api.processes.v1.schemas.qualifiedInputValue
          - type:
            - string
            - number
            - integer
            - boolean
            - array
            - object
      outputs:
        type: object
        propertyNames:
          enum:
          - product
      response:
        enum:
        - raw
        - document
  results:
    description: Results document (response=document) for this process (see U-01).
    type: object
    propertyNames:
      enum:
      - product
    additionalProperties:
      anyOf:
      - $ref: bblocks://ogc.api.processes.v1.schemas.link
      - type: array
        items:
          $ref: bblocks://ogc.api.processes.v1.schemas.link
      - type:
        - string
        - number
        - integer
        - boolean
        - array
        - object
  processRun:
    $ref: bblocks://ogc.bbr.wf4ever.wfprov.ProcessRun
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
    - type: object
      required:
      - id
      - version
      - inputs
      - outputs
      properties:
        id:
          const: download-band-sentinel2-stac-item
        inputs:
          type: object
          required:
          - product_url
          - band
          propertyNames:
            enum:
            - product_url
            - band
        outputs:
          type: object
          required:
          - product
          propertyNames:
            enum:
            - product
    - description: '`download-band-sentinel2-stac-item` as the Implementation (instance level) of `https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/band-retrieval`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: product
          - contains:
              const: band
          - contains:
              const: retrieval
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/concept/data-discovery-and-access
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/band-retrieval
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/band-retrieval
        inputs:
          type: object
          required:
          - band
          - product_url
          properties:
            product_url:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://geolabs.github.io/bblocks-data-types/def/data-type/eo-product
                keywords:
                  allOf:
                  - contains:
                      const: product
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/band-retrieval/inputs/product
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/band-retrieval/inputs/product
                minOccurs:
                  type: integer
                  minimum: 0
                  maximum: 1
            band:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://geolabs.github.io/bblocks-data-types/def/data-type/band-identifier
                keywords:
                  allOf:
                  - contains:
                      const: band
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/band-retrieval/inputs/band
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/band-retrieval/inputs/band
                minOccurs:
                  type: integer
                  minimum: 0
                  maximum: 1
        outputs:
          type: object
          required:
          - product
          properties:
            product:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://geolabs.github.io/bblocks-data-types/def/data-type/raster
                keywords:
                  allOf:
                  - contains:
                      const: raster
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/band-retrieval/outputs/raster
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-output
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/band-retrieval/outputs/raster
