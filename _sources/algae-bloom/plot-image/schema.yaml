$schema: https://json-schema.org/draft/2020-12/schema
description: Profile of the OGC API - Processes processDescription of `plot-image` (CWL CommandLineTool).
  Pins the process id and the input/output names; the input/output schemas are those derived from the
  CWL.
allOf:
- $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
- $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
- type: object
  required:
  - id
  - version
  - inputs
  - outputs
  properties:
    id:
      const: plot-image
    inputs:
      type: object
      required:
      - input_image
      - color_scale
      - output_name
      - plot_name
      - plot_title
      - clip_min
      - clip_max
      propertyNames:
        enum:
        - input_image
        - color_scale
        - output_name
        - plot_name
        - plot_title
        - clip_min
        - clip_max
    outputs:
      type: object
      required:
      - output_file
      - output_plot
      propertyNames:
        enum:
        - output_file
        - output_plot
$defs:
  rawProcessDescription:
    $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
  applicationPackage:
    $ref: bblocks://ogc.api.processes.part2.v1.schemas.ogcapppkg
  provenance:
    $ref: bblocks://ogc.bbr.provenance.provenance
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  w3cProvJsonLd:
    $ref: bblocks://ogc.ogc-utils.prov.w3c-prov-jsonld
  execute:
    description: Execute request for this process. Built on the processDescription input schemas and on
      ogc.api.processes.part1.v1.schemas.link / qualifiedInputValue, because ogc.api.processes.part1.v1.schemas.execute
      rejects plain strings and numbers (upstream issue U-01).
    type: object
    required:
    - inputs
    properties:
      inputs:
        type: object
        required:
        - input_image
        - color_scale
        propertyNames:
          enum:
          - input_image
          - color_scale
          - output_name
          - plot_name
          - plot_title
          - clip_min
          - clip_max
        additionalProperties:
          anyOf:
          - $ref: bblocks://ogc.api.processes.part1.v1.schemas.link
          - $ref: bblocks://ogc.api.processes.part1.v1.schemas.qualifiedInputValue
          - type:
            - string
            - number
            - integer
            - boolean
            - array
            - object
      outputs:
        type: object
        propertyNames:
          enum:
          - output_file
          - output_plot
      response:
        enum:
        - raw
        - document
  results:
    description: Results document (response=document) for this process (see U-01).
    type: object
    propertyNames:
      enum:
      - output_file
      - output_plot
    additionalProperties:
      anyOf:
      - $ref: bblocks://ogc.api.processes.part1.v1.schemas.link
      - type: array
        items:
          $ref: bblocks://ogc.api.processes.part1.v1.schemas.link
      - type:
        - string
        - number
        - integer
        - boolean
        - array
        - object
  processRun:
    $ref: bblocks://ogc.bbr.wf4ever.wfprov.ProcessRun
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
    - type: object
      required:
      - id
      - version
      - inputs
      - outputs
      properties:
        id:
          const: plot-image
        inputs:
          type: object
          required:
          - input_image
          - color_scale
          - output_name
          - plot_name
          - plot_title
          - clip_min
          - clip_max
          propertyNames:
            enum:
            - input_image
            - color_scale
            - output_name
            - plot_name
            - plot_title
            - clip_min
            - clip_max
        outputs:
          type: object
          required:
          - output_file
          - output_plot
          propertyNames:
            enum:
            - output_file
            - output_plot
    - description: '`plot-image` as the Implementation (instance level) of `https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-rendering`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: raster
          - contains:
              const: rendering
          - contains:
              const: colour map
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/concept/raster-coverage-processing
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-rendering
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-rendering
        inputs:
          type: object
          required:
          - color_scale
          - input_image
          properties:
            input_image:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://geolabs.github.io/bblocks-data-types/def/data-type/raster
                keywords:
                  allOf:
                  - contains:
                      const: raster
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-rendering/inputs/raster
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-rendering/inputs/raster
                minOccurs:
                  type: integer
                  minimum: 0
                  maximum: 1
            color_scale:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://geolabs.github.io/bblocks-data-types/def/data-type/colour-map
                keywords:
                  allOf:
                  - contains:
                      const: colour map
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-rendering/inputs/colourMap
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-rendering/inputs/colourMap
                minOccurs:
                  type: integer
                  minimum: 0
                  maximum: 1
        outputs:
          type: object
          required:
          - output_plot
          properties:
            output_plot:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://geolabs.github.io/bblocks-data-types/def/data-type/rendered-image
                keywords:
                  allOf:
                  - contains:
                      const: image
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-rendering/outputs/image
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-output
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-rendering/outputs/image
