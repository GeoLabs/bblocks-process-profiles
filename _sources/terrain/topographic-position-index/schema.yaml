$schema: https://json-schema.org/draft/2020-12/schema
description: 'Profile of the live OGC API - Processes processDescription of `SAGA.ta_morphometry.18`.
  Pins the process id and the input/output names. No execute/results/provenance $defs or examples: static
  processDescription only (no CWLProv-style run record exists for a live deployed service).'
allOf:
- $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
- $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
- type: object
  required:
  - id
  - inputs
  - outputs
  properties:
    id:
      const: SAGA.ta_morphometry.18
    inputs:
      type: object
      required:
      - DEM
      - STANDARD
      - RADIUS_MIN
      - RADIUS_MAX
      - DW_WEIGHTING
      - DW_IDW_POWER
      - DW_IDW_OFFSET
      - DW_BANDWIDTH
    outputs:
      type: object
      required:
      - TPI
$defs:
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
    - type: object
      required:
      - id
      - inputs
      - outputs
      properties:
        id:
          const: SAGA.ta_morphometry.18
        inputs:
          type: object
          required:
          - DEM
          - STANDARD
          - RADIUS_MIN
          - RADIUS_MAX
          - DW_WEIGHTING
          - DW_IDW_POWER
          - DW_IDW_OFFSET
          - DW_BANDWIDTH
        outputs:
          type: object
          required:
          - TPI
    - description: '`SAGA.ta_morphometry.18` as the Implementation (instance level) of `https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/topographic-position-index`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: terrain
          - contains:
              const: elevation
          - contains:
              const: raster
          - contains:
              const: derivative
          - contains:
              const: TPI
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/concept/terrain-analysis
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/terrain-derivative
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/topographic-position-index
        inputs:
          type: object
          required:
          - DEM
          properties:
            DEM:
              required:
              - dataType
              - keywords
              - metadata
              - representation
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/elevation-model
                keywords:
                  allOf:
                  - contains:
                      const: elevation
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/terrain-derivative/inputs/elevation
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/topographic-position-index/inputs/elevation
                representation:
                  const:
                  - https://w3id.org/geolabs/ospd/data-formats/representation/elevation-model-aaigrid
                  - https://w3id.org/geolabs/ospd/data-formats/representation/elevation-model-envi
                  - https://w3id.org/geolabs/ospd/data-formats/representation/elevation-model-geotiff
                  - https://w3id.org/geolabs/ospd/data-formats/representation/elevation-model-png
        outputs:
          type: object
          required:
          - TPI
          properties:
            TPI:
              required:
              - dataType
              - keywords
              - metadata
              - representation
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/raster-single-band
                keywords:
                  allOf:
                  - contains:
                      const: raster
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/terrain-derivative/outputs/result
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/topographic-position-index/outputs/result
                representation:
                  const:
                  - https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-aaigrid
                  - https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-envi
                  - https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-geotiff
                  - https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-png
