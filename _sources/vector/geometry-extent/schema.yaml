$schema: https://json-schema.org/draft/2020-12/schema
description: 'Profile of the live OGC API - Processes processDescription of `SAGA.shapes_tools.19`. Pins
  the process id and the input/output names. No execute/results/provenance $defs or examples: static processDescription
  only (no CWLProv-style run record exists for a live deployed service).'
allOf:
- $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
- $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
- type: object
  required:
  - id
  - inputs
  - outputs
  properties:
    id:
      const: SAGA.shapes_tools.19
    inputs:
      type: object
      required:
      - SHAPES
      - OUTPUT
    outputs:
      type: object
      required:
      - EXTENTS
$defs:
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
    - type: object
      required:
      - id
      - inputs
      - outputs
      properties:
        id:
          const: SAGA.shapes_tools.19
        inputs:
          type: object
          required:
          - SHAPES
          - OUTPUT
        outputs:
          type: object
          required:
          - EXTENTS
    - description: '`SAGA.shapes_tools.19` as the Implementation (instance level) of `https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/geometry-extent`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: vector
          - contains:
              const: geometry
          - contains:
              const: derived geometry
          - contains:
              const: Envelope
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/concept/vector-geometry-processing
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/unary-geometry-operation
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/geometry-extent
        inputs:
          type: object
          required:
          - SHAPES
          properties:
            SHAPES:
              required:
              - dataType
              - keywords
              - metadata
              - representation
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/geometry
                keywords:
                  allOf:
                  - contains:
                      const: geometry
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/unary-geometry-operation/inputs/geometry
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/geometry-extent/inputs/geometry
                representation:
                  const:
                  - https://w3id.org/geolabs/ospd/data-formats/representation/geometry-gml
                  - https://w3id.org/geolabs/ospd/data-formats/representation/geometry-kml
        outputs:
          type: object
          required:
          - EXTENTS
          properties:
            EXTENTS:
              required:
              - dataType
              - keywords
              - metadata
              - representation
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/surface
                keywords:
                  allOf:
                  - contains:
                      const: geometry
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/unary-geometry-operation/outputs/result
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/geometry-extent/outputs/result
                representation:
                  const:
                  - https://w3id.org/geolabs/ospd/data-formats/representation/surface-gml
                  - https://w3id.org/geolabs/ospd/data-formats/representation/surface-kml
