$schema: https://json-schema.org/draft/2020-12/schema
description: 'Profile of the live OGC API - Processes processDescription of `SAGA.pointcloud_tools.5`.
  Pins the process id and the input/output names. No execute/results/provenance $defs or examples: static
  processDescription only (no CWLProv-style run record exists for a live deployed service).'
allOf:
- $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
- $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
- type: object
  required:
  - id
  - inputs
  - outputs
  properties:
    id:
      const: SAGA.pointcloud_tools.5
    inputs:
      type: object
      required:
      - POINTS
    outputs:
      type: object
      required:
      - SHAPES
$defs:
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
    - type: object
      required:
      - id
      - inputs
      - outputs
      properties:
        id:
          const: SAGA.pointcloud_tools.5
        inputs:
          type: object
          required:
          - POINTS
        outputs:
          type: object
          required:
          - SHAPES
    - description: '`SAGA.pointcloud_tools.5` as the Implementation (instance level) of `https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/point-cloud-to-shapes`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: point cloud
          - contains:
              const: feature collection
          - contains:
              const: conversion
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/concept/point-cloud-processing
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/point-cloud-to-features
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/point-cloud-to-shapes
        inputs:
          type: object
          required:
          - POINTS
          properties:
            POINTS:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/point-cloud
                keywords:
                  allOf:
                  - contains:
                      const: point cloud
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/point-cloud-to-features/inputs/points
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/point-cloud-to-shapes/inputs/points
        outputs:
          type: object
          required:
          - SHAPES
          properties:
            SHAPES:
              required:
              - dataType
              - keywords
              - metadata
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/feature-collection
                keywords:
                  allOf:
                  - contains:
                      const: feature collection
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/point-cloud-to-features/outputs/result
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/point-cloud-to-shapes/outputs/result
