$schema: https://json-schema.org/draft/2020-12/schema
description: 'Profile of the live OGC API - Processes processDescription of `SAGA.pointcloud_tools.9`.
  Pins the process id and the input/output names. No execute/results/provenance $defs or examples: static
  processDescription only (no CWLProv-style run record exists for a live deployed service).'
allOf:
- $ref: bblocks://ogc.api.processes.v1.schemas.process
- $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
- type: object
  required:
  - id
  - inputs
  - outputs
  properties:
    id:
      const: SAGA.pointcloud_tools.9
    inputs:
      type: object
      required:
      - INPUT
      - PERCENT
      - NUMBER
    outputs:
      type: object
      required:
      - RESULT
$defs:
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
    - type: object
      required:
      - id
      - inputs
      - outputs
      properties:
        id:
          const: SAGA.pointcloud_tools.9
        inputs:
          type: object
          required:
          - INPUT
          - PERCENT
          - NUMBER
        outputs:
          type: object
          required:
          - RESULT
    - description: '`SAGA.pointcloud_tools.9` as the Implementation (instance level) of `https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/point-cloud-thinning`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: point cloud
          - contains:
              const: thinning
          - contains:
              const: Point Cloud Thinning
          - contains:
              const: pointcloud_tools
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/concept/point-cloud-processing
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/point-cloud-thinning
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/point-cloud-thinning
        inputs:
          type: object
          required:
          - INPUT
          - PERCENT
          properties:
