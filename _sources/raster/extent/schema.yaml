$schema: https://json-schema.org/draft/2020-12/schema
description: 'Profile of the live OGC API - Processes processDescription of `OTB.ImageEnvelope`. Pins
  the process id and the input/output names. No execute/results/provenance $defs or examples: static processDescription
  only (no CWLProv-style run record exists for a live deployed service).'
allOf:
- $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
- $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
- type: object
  required:
  - id
  - inputs
  - outputs
  properties:
    id:
      const: OTB.ImageEnvelope
    inputs:
      type: object
      required:
      - in
      - sr
      - elev
      - elev.geoid
      - elev.default
      - proj
    outputs:
      type: object
      required:
      - out
$defs:
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.part1.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.part2.v1.schemas.staticIndicator
    - type: object
      required:
      - id
      - inputs
      - outputs
      properties:
        id:
          const: OTB.ImageEnvelope
        inputs:
          type: object
          required:
          - in
          - sr
          - elev
          - elev.geoid
          - elev.default
          - proj
        outputs:
          type: object
          required:
          - out
    - description: '`OTB.ImageEnvelope` as the Implementation (instance level) of `https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/raster-extent`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: raster
          - contains:
              const: coverage
          - contains:
              const: extent
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/concept/raster-coverage-processing
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/raster-extent
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/raster-extent
        inputs:
          type: object
          required:
          - in
          properties:
            in:
              required:
              - dataType
              - keywords
              - metadata
              - representation
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/raster
                keywords:
                  allOf:
                  - contains:
                      const: raster
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/raster-extent/inputs/raster
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-input
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/raster-extent/inputs/raster
                representation:
                  const:
                  - https://w3id.org/geolabs/ospd/data-formats/representation/raster-geotiff
                  - https://w3id.org/geolabs/ospd/data-formats/representation/raster-jpeg
                  - https://w3id.org/geolabs/ospd/data-formats/representation/raster-png
        outputs:
          type: object
          required:
          - out
          properties:
            out:
              required:
              - dataType
              - keywords
              - metadata
              - representation
              properties:
                dataType:
                  const: https://w3id.org/geolabs/ospd/data-types/data-type/surface
                keywords:
                  allOf:
                  - contains:
                      const: geometry
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/generic-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/generic-profile/raster-extent/outputs/result
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/role/implementation-output
                        href:
                          const: https://w3id.org/geolabs/ospd/generic-profiles/implementation-profile/raster-extent/outputs/result
                representation:
                  const:
                  - https://w3id.org/geolabs/ospd/data-formats/representation/surface-gml
                  - https://w3id.org/geolabs/ospd/data-formats/representation/surface-kml
