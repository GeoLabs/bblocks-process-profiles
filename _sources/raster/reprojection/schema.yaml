$schema: https://json-schema.org/draft/2020-12/schema
description: 'Profile of the live OGC API - Processes processDescription of `Gdal_Warp`. Pins the process
  id and the input/output names. No execute/results/provenance $defs or examples: static processDescription
  only (no CWLProv-style run record exists for a live deployed service).'
allOf:
- $ref: bblocks://ogc.api.processes.v1.schemas.process
- $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
- type: object
  required:
  - id
  - inputs
  - outputs
  properties:
    id:
      const: Gdal_Warp
    inputs:
      type: object
      required:
      - Format
      - InputDSN
      - OutputDSN
      - s_srs
      - t_srs
      - tps
      - geoloc
      - rpc
      - r
      - order
      - te
    outputs:
      type: object
      required:
      - Result
$defs:
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  inheritedProcessDescription:
    allOf:
    - $ref: bblocks://ogc.api.processes.v1.schemas.process
    - $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
    - type: object
      required:
      - id
      - inputs
      - outputs
      properties:
        id:
          const: Gdal_Warp
        inputs:
          type: object
          required:
          - Format
          - InputDSN
          - OutputDSN
          - s_srs
          - t_srs
          - tps
          - geoloc
          - rpc
          - r
          - order
          - te
        outputs:
          type: object
          required:
          - Result
    - description: '`Gdal_Warp` as the Implementation (instance level) of `https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-reprojection`:
        Table 21 keywords (E) and footnote-a metadata references (Table 22 roles) inherited from its Implementation
        Profile.'
      type: object
      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: raster
          - contains:
              const: coverage
          - contains:
              const: reprojection
          - contains:
              const: GDAL
          - contains:
              const: gdalwarp
        metadata:
          allOf:
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/concept
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/concept/raster-coverage-processing
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/generic
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-reprojection
          - contains:
              type: object
              required:
              - role
              - href
              properties:
                role:
                  const: http://www.opengis.net/spec/wps/2.0/def/process-profile/implementation
                href:
                  const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-reprojection
        inputs:
          type: object
          required:
          - InputDSN
          - t_srs
          properties:
            InputDSN:
              required:
              - keywords
              - metadata
              properties:
                keywords:
                  allOf:
                  - contains:
                      const: raster
                  - contains:
                      const: GeoTIFF
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-reprojection/inputs/raster
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-reprojection/inputs/raster
            t_srs:
              required:
              - keywords
              - metadata
              properties:
                keywords:
                  allOf:
                  - contains:
                      const: CRS
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-reprojection/inputs/targetCRS
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-input
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-reprojection/inputs/targetCRS
                minOccurs:
                  type: integer
                  minimum: 0
                  maximum: 1
        outputs:
          type: object
          required:
          - Result
          properties:
            Result:
              required:
              - keywords
              - metadata
              properties:
                keywords:
                  allOf:
                  - contains:
                      const: raster
                  - contains:
                      const: GeoTIFF
                metadata:
                  allOf:
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/generic-output
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/generic-profile/raster-reprojection/outputs/raster
                  - contains:
                      type: object
                      required:
                      - role
                      - href
                      properties:
                        role:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/role/implementation-output
                        href:
                          const: https://geolabs.github.io/bblocks-generic-profiles/def/implementation-profile/raster-reprojection/outputs/raster
