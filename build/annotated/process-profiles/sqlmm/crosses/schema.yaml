      required:
      - keywords
      - metadata
      properties:
        keywords:
          allOf:
          - contains:
              const: vector
          - contains:
              const: geometry
          - contains:
              const: spatial relation
          - contains:
              const: predicate
          - contains:
              const: Crosses
          - contains:
